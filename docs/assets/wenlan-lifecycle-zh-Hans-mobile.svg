<svg width="720" height="2160" viewBox="0 0 720 2160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title id="title">知识会改变，历史仍会保留。</title>
    <desc id="desc">过时页面依当前依据重建；被取代的知识仍可追溯。</desc>
    <style>text { font-kerning: normal; }</style>
    <rect width="720" height="2160" fill="#FCFCFB"/>

