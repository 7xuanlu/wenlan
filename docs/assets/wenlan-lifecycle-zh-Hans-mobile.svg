  </g>
    <g data-fit-region="lifecycle-zh-Hans-mobile-heading" data-fit-x="122" data-fit-y="44" data-fit-width="558" data-fit-height="210" data-check-overlap="false">

        <text x="122" y="70" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" fill="#8B93A3" text-anchor="start">两套相连的生命周期</text>
