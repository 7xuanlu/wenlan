<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wenlan README banner</title>
  <desc id="desc">Wenlan: Una wiki personal viva. La IA organiza. Tú tienes el control.</desc>
  <rect width="1280" height="320" fill="#191C24"/>
  <g transform="translate(80 72) scale(0.34375)">
    <rect width="512" height="512" rx="112" fill="#1A1A2E"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#banner-es-ES-desktop-ring)" stroke-width="76"/>
    <circle cx="322" cy="160" r="42" fill="url(#banner-es-ES-desktop-orb)"/>
  </g>
  <text x="312" y="108" fill="#93E3F2" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="4">WENLAN</text>
  <text x="312" y="165" fill="#F7F8FF" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="44" font-weight="700" text-anchor="start">Una wiki personal viva.</text>
  <text x="312" y="211" fill="#F7F8FF" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="32" font-weight="400" text-anchor="start">La IA organiza. Tú tienes el control.</text>
  <defs>
    <linearGradient id="banner-es-ES-desktop-ring" x1="96" y1="256" x2="416" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#5BA3E6"/>
      <stop offset="1" stop-color="#4AC8E8"/>
    </linearGradient>
    <radialGradient id="banner-es-ES-desktop-orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 144) rotate(52.125) scale(76.0263)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#A5C4F7"/>
      <stop offset="1" stop-color="#4AC8E8"/>
    </radialGradient>
  </defs>
</svg>
