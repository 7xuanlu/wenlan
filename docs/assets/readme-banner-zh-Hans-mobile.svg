<svg width="720" height="256" viewBox="0 0 720 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wenlan README banner</title>
  <desc id="desc">Wenlan: 持续更新的个人维基。 AI 帮你整理，你保有主导权。</desc>
  <rect width="720" height="256" fill="#191C24"/>
  <g transform="translate(316 20) scale(0.171875)">
    <rect width="512" height="512" rx="112" fill="#1A1A2E"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#banner-zh-Hans-mobile-ring)" stroke-width="76"/>
    <circle cx="322" cy="160" r="42" fill="url(#banner-zh-Hans-mobile-orb)"/>
  </g>
  <text x="360" y="138" fill="#93E3F2" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="4">WENLAN</text>
  <text x="360" y="185" fill="#F7F8FF" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="34" font-weight="700" text-anchor="middle">持续更新的个人维基。</text>
